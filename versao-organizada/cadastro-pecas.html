<title>Cadastro de Peças</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2327466f'/%3E%3Cpath d='M16 7l6 6-6 12-6-12z' fill='%23fff'/%3E%3C/svg%3E">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="only light"><meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: página única — topo · planilha com as 31 colunas (ocupa o meio) · lançamento na parte de baixo com os mesmos nomes de coluna · configurações expansíveis abaixo */
:root{
  --bg:#f1f3f7; --surface:#ffffff; --surface-2:#e9edf3; --line:#d5dbe5; --ink:#18202e; --muted:#5d6b80;
  --accent:#27466f; --accent-ink:#ffffff; --accent-soft:#e3ebf6;
  --gold:#b8892a; --silver:#8a93a2; --rhod:#5a6c8f; --sel:#edf3fb; --ov:#7b5bd6;
  --warn:#9a5b0c; --bad:#b3362f; --bad-soft:#fbe4e1; --focus:#2f6bd0;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root[data-theme="dark-off"]{
  --bg:#0f141c; --surface:#171d28; --surface-2:#212938; --line:#2d3649; --ink:#e7ecf4; --muted:#93a1b8;
  --accent:#7fa6e6; --accent-ink:#0c1522; --accent-soft:#1d2b44; --gold:#dcb45c; --silver:#b4bccb; --rhod:#8fa3cc; --sel:#1b2536; --ov:#a58cf0;
  --warn:#e0a24f; --bad:#ec7a70; --bad-soft:#3d2220; --focus:#7fa6e6; color-scheme:dark}}
:root[data-theme="dark-off"]{
  --bg:#0f141c; --surface:#171d28; --surface-2:#212938; --line:#2d3649; --ink:#e7ecf4; --muted:#93a1b8;
  --accent:#7fa6e6; --accent-ink:#0c1522; --accent-soft:#1d2b44; --gold:#dcb45c; --silver:#b4bccb; --rhod:#8fa3cc; --sel:#1b2536; --ov:#a58cf0;
  --warn:#e0a24f; --bad:#ec7a70; --bad-soft:#3d2220; --focus:#7fa6e6; color-scheme:dark}
*{box-sizing:border-box}
:root{color-scheme:light}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:13px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--surface);border-bottom:1px solid var(--line)}
.hin{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;min-height:46px;padding-block:6px}
.hin h1{font-family:var(--display);font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.status{font-size:12px;color:var(--muted)} .status.bad{color:var(--bad)}
.hin .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font:500 12.5px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)} .btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none} .btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.big{padding:6px 16px;font-size:13.5px;font-weight:600}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 7px;min-width:0;width:100%;height:28px}
input[type=checkbox],input[type=radio]{width:auto;height:auto;margin:0;accent-color:var(--accent)}
input:focus,select:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 20%,transparent)}
input::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
input.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.65}
.seqs{display:flex;gap:6px;flex-wrap:wrap}
.seq{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.seq b{color:var(--ink);font-weight:600}

/* área de trabalho: planilha em cima, lançamento embaixo */
.work{display:flex;flex-direction:column;gap:8px;padding-block:8px}
.tools{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;min-height:24px;flex:none}
.bulk{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:8px;padding:3px 6px}
.bulk select,.bulk input{height:24px;padding:1px 6px;font-size:12px;width:auto}
.bulk input{width:120px}
.issues{font-size:12px;color:var(--warn);display:flex;gap:2px 12px;flex-wrap:wrap}
.issues .bad{color:var(--bad);font-weight:500} .issues .ok{color:var(--muted)}
.sheet{height:max(220px,calc(100vh - 47px - 460px));resize:vertical;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}

table.t{border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:100%}
table.t th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;font-weight:600;font-size:11.5px;padding:4px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;min-width:84px}
table.t th small{display:block;font-family:var(--mono);font-weight:400;color:var(--muted);font-size:10px}
table.t td{padding:0 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;height:28px;position:relative;cursor:cell}
table.t td.n{text-align:right;font-family:var(--mono)}
table.t td.fx{color:var(--accent)}
table.t td.ref{font-family:var(--mono);font-weight:600}
table.t td.dup{color:var(--bad);background:var(--bad-soft)!important}
table.t td.ov::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent var(--ov) transparent transparent}
table.t td.miss{background:color-mix(in srgb,var(--warn) 9%,transparent)}
table.t td[data-c]:hover{box-shadow:inset 0 0 0 1px var(--focus)}
table.t td.ed{position:relative;z-index:4;padding:0;overflow:visible;box-shadow:inset 0 0 0 2px var(--focus)}
table.t td.ed input{height:27px;width:100%;min-width:0;box-sizing:border-box;border:0;border-radius:0;box-shadow:none;padding:0 5px;background:var(--surface)!important;color:var(--ink)!important;-webkit-text-fill-color:var(--ink);caret-color:var(--focus);font-size:13px;opacity:1}
table.t th.k,table.t td.k{position:sticky;left:0;z-index:1;background:var(--surface);padding:0 3px;cursor:default;box-shadow:1px 0 0 var(--line);min-width:0}
table.t th.k{z-index:3;background:var(--surface-2)}
.k .in{display:flex;align-items:center}
.k input{margin:0 4px}
.k button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12.5px;width:22px;height:24px;border-radius:5px;padding:0}
.k button:hover{color:var(--ink);background:var(--surface-2)} .k button.del:hover{color:var(--bad)}
table.t tbody tr:hover td{background:var(--surface-2)}
table.t tbody tr.hl td{background:var(--sel)}
table.t tbody tr.on td,table.t tbody tr.edl td{background:var(--accent-soft)}
table.t tr.blank td{background:transparent}
table.t tr.blank td.k .nb{font-size:10.5px;color:var(--muted);padding-left:6px}
table.t tr.blank:hover td{background:var(--surface-2)}
table.t tr.catsep td{background:var(--bg)!important;font-family:var(--display);font-weight:600;font-size:12px;color:var(--muted);cursor:default;height:22px;box-shadow:none!important}
.lt{display:inline-block;font-size:9.5px;font-weight:700;border-radius:3px;padding:0 4px;margin-left:4px;color:#fff;vertical-align:1px;font-family:var(--body)}
.lt.R{background:var(--gold)} .lt.T{background:var(--silver)} .lt.S{background:var(--rhod)}
tfoot td{position:sticky;bottom:0;background:var(--surface-2)!important;font-size:12px;color:var(--muted);cursor:default!important;box-shadow:none!important}
tfoot b{color:var(--ink);font-family:var(--mono)}
.edhint{position:sticky;left:0;padding:0 8px}
.empty{padding:24px 22px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:620px}
.empty h2{font-family:var(--display);margin:0;font-size:18px} .empty p{margin:0;color:var(--muted)}

/* lançamento (parte de baixo) */
form.lanc{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 -4px 14px color-mix(in srgb,var(--ink) 5%,transparent)}
form.lanc.editing{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.fbar{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--line)}
.fbar h2{font-family:var(--display);font-size:14px;margin:0;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--surface-2);height:28px}
.seg button{border:0;background:none;font:500 12px var(--body);color:var(--muted);padding:0 9px;border-radius:5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 14%,transparent)}
.mini{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.mini select,.mini input{height:26px;width:auto}
.fcols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0}
.fcols>.fsec{padding:6px 10px 9px;min-width:0}
.fcols>.fsec+.fsec{border-left:1px solid var(--line);background:color-mix(in srgb,var(--surface-2) 40%,var(--surface))}
.fsec h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 3px;font-weight:600}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px 8px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px 8px}
.g4.dn{grid-auto-flow:row dense}
.fl{display:flex;flex-direction:column;gap:0;min-width:0}
.fl.w2{grid-column:span 2}
.fl>span{font-size:10.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center;line-height:1.5}
.fl>span .k{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none}
.fl.req>span{color:var(--ink)}
#form input,#form select{height:26px;padding:2px 6px}
.ult{font-family:var(--mono);font-size:10px;color:var(--accent);margin-left:auto;display:inline-flex;align-items:center;gap:2px}
#form .ult input{width:46px;height:15px;padding:0 3px;font-size:10px;border-radius:3px;text-align:right}
.bb{border:1px solid var(--line);border-radius:7px;padding:3px 7px 5px;margin-top:4px;background:var(--surface)}
.bb.off .g4,.bb.off .bt input:not([type=checkbox]){opacity:.45}
.bt{display:flex;gap:8px;align-items:center}
.bt label{display:flex;align-items:center;gap:5px;font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap;flex:none}
#form .bt input:not([type=checkbox]){height:22px;font-size:12px;border-color:transparent;background:var(--surface-2)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.d-R{background:var(--gold)} .d-T{background:var(--silver)} .d-S{background:var(--rhod)}
.gera{display:flex;gap:4px 6px;flex-wrap:wrap;align-items:center;flex:1 1 160px;min-width:0;font-size:12px;color:var(--muted)}
.gera .ch{font-family:var(--mono);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--surface-2);color:var(--ink);font-weight:600}
.gera .ch.dupe{border-color:var(--bad);color:var(--bad)}
.gera .err{color:var(--bad);font-weight:600} .gera .warn{color:var(--warn)}
.add{display:flex;gap:6px;margin-left:auto}
.btn.big{height:30px;padding:0 18px;font-size:13.5px;font-weight:600}
@media (max-width:980px){.fcols{grid-template-columns:1fr}.fcols>.fsec+.fsec{border-left:0;border-top:1px solid var(--line)}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.vchk{display:flex;align-items:center;gap:5px;font-size:12.5px;cursor:pointer;white-space:nowrap}

/* configurações */
.secs{display:flex;flex-direction:column;gap:8px;padding-block:6px 60px}
.secs>h2{font-family:var(--display);font-size:15px;margin:4px 0 0;color:var(--muted);font-weight:600}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.sec>summary{cursor:pointer;list-style:none;padding:10px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--muted);font-size:11px;width:10px}
details.sec[open]>summary::before{content:"▾"}
details.sec>summary b{font-family:var(--display);font-size:14.5px;font-weight:600}
details.sec>summary span{color:var(--muted);font-size:12px;min-width:0}
.sb{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sb p.d{margin:0;color:var(--muted);font-size:12.5px;max-width:85ch}
.tw{overflow-x:auto}
table.cfg{border-collapse:collapse;width:100%}
table.cfg th{font-size:11px;color:var(--muted);text-align:left;font-weight:600;padding:5px 6px;white-space:nowrap}
table.cfg td{padding:3px 6px;border-top:1px solid var(--line);vertical-align:middle}
table.cfg td.c{text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.hint{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 3px 2px 9px;font-size:12.5px}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;width:18px;height:18px;border-radius:50%;padding:0}
.chip button:hover{color:var(--bad)}
.chips input{width:160px;height:26px;border-radius:999px;font-size:12.5px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:5px}
.x:hover{color:var(--bad);background:var(--surface-2)}
.banner{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:9px;padding:6px 12px;display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;flex:none}
.banner p{margin:0;flex:1 1 260px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 8px 8px 14px;border-radius:9px;font-size:13px;z-index:20;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px)}
.toast button{background:none;border:1px solid color-mix(in srgb,var(--bg) 45%,transparent);color:var(--bg);border-radius:6px;padding:2px 9px;cursor:pointer;font:inherit;font-size:12px}
textarea.cp{width:100%;height:90px;font-family:var(--mono);font-size:11px}
@media (max-width:900px){.work{height:auto}.sheet{max-height:55vh;min-height:220px}form.lanc{max-height:none}.bl .bh{grid-template-columns:1fr 1fr}.bl .bh>label.t,.bl .bh>.fl.w2{grid-column:1/-1}}

/* lançamento em 4 colunas verticais: rótulo à esquerda, campos numéricos estreitos */
.f4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.f4>.col{padding:6px 10px 8px;min-width:0;display:flex;flex-direction:column;gap:3px}
.f4>.col+.col{border-left:1px solid var(--line)}
.f4 h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 1px;font-weight:600}
.fr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:6px;align-items:center;min-width:0}
.fr.num{grid-template-columns:minmax(0,1fr) 84px}
.fr>span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center}
.fr>span .k{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none}
.fr.req>span{color:var(--ink);font-weight:500}
#form .fr input,#form .fr select{height:24px;padding:1px 6px;font-size:12.5px}
.fc{display:flex;flex-direction:column;min-width:0}
.fc>span{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
#form .fc input{height:24px;padding:1px 5px;font-size:12.5px}
.f4 .bb{margin-top:0}
.fbar .ult{margin-left:0;font-size:11.5px}
#form .fbar .ult input{width:56px;height:24px;font-size:12px}
.sheet{height:max(240px,calc(100vh - 47px - 360px))}
table.t tr.blank td{background:var(--surface);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--line) 70%,transparent)}
table.t tr.blank:nth-child(even) td{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
table.t tr.blank td.ph::before{content:"clique e cole (Ctrl+V)";color:var(--muted);font-size:11.5px}
@media (max-width:1100px){.f4{grid-template-columns:repeat(2,minmax(0,1fr))}.f4>.col:nth-child(3){border-left:0}.f4>.col:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:600px){.f4{grid-template-columns:1fr}.f4>.col+.col{border-left:0;border-top:1px solid var(--line)}}

/* ===== v10: hierarquia do lançamento ===== */
form.lanc{max-width:none}
.w-c{width:128px}
.lv1{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line)}
.lv1>.grp{padding:6px 12px 8px;min-width:0}
.lv1>.grp:first-child{flex:1 1 520px}
.lv1>.grp+.grp{border-left:1px solid var(--line);flex:0 1 auto}
.grp h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 2px;font-weight:600}
.rw{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:flex-end}
.fq{display:flex;flex-direction:column;min-width:0;position:relative}
.fq>span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;display:flex;gap:6px;align-items:center}
.fq.req>span{color:var(--ink);font-weight:500}
.fq.off>input{opacity:.45}
#form .fq input,#form .fq select{height:28px}
.w-n{width:78px} .w-c{width:104px} .w-q{width:150px} .w-s{width:120px} .w-m{width:170px} .w-l{flex:1 1 200px;min-width:180px}
.fq .plus{position:absolute;right:-26px;bottom:2px;width:22px;height:24px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--accent);cursor:pointer;font-weight:700}
.fq:has(.plus){margin-right:26px}
.ck{display:flex;align-items:center;gap:5px;cursor:pointer;color:var(--ink);font-weight:600}
.nf{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:flex-end;margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--accent-soft)}
.nf>b{font-size:12px;align-self:center}
.lv2{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:flex-end;padding:10px 12px;background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}

function fatorDoPreco(k){
  const f=S.form,pronta=k==="p",id=editId||"__p";f.mk=f.mk||{};f.ov=f.ov||{};
  const vOld=pronta?f.v.V:(f.ov[k]||{}).V;if(vazio(vOld))return;const alvo=num(vOld);if(alvo==null||alvo<0)return;

    const g=previsao(),ri=g.linhas.findIndex(r=>r.lancId===id&&(r.bid||r.key)===k);
    if(ri>=0){const x=celulas(g.linhas[ri],ri+2,true)[LET.indexOf("V")];if(x&&typeof x.v==="number")base=x.v}}

  if(!(base>0)){toast("Para o fator ser calculado, informe antes o peso e os custos.");return}

banho:`<div class="expl"><b>Para que serve esta aba</b><p>Aqui você diz <b>qual galvânica</b> banha as peças e <b>quanto cada banho custa</b>. Cada banho que você marca ao lançar uma peça vira uma linha na planilha (ex.: a mesma argola em Ouro e em Prata gera 2 linhas).</p><ul><li><b>Letra do banho:</b> uma letra que entra no código da peça. Ex.: AN001<b>A</b> = anel 001, banho A. Vai na coluna E.</li><li><b>Custo do banho (colunas R, S ou T):</b> o valor que a galvânica cobra. Pode ser por peso (peso da peça × valor por grama) ou um valor fixo por peça. O verniz tem coluna própria (U).</li><li><b>Milésimos:</b> a espessura do banho. Quanto maior, mais caro. Você pode ter um valor diferente por categoria; a linha “Padrão” vale para as categorias que você não ajustou.</li><li><b>Insumos:</b> o que se gasta além do metal (embalagem, fecho, etc.). Soma no custo (coluna Q).</li><li><b>Preço de Varejo (coluna V):</b> é a soma dos custos multiplicada pelo <b>fator</b> do banho (a sua margem). Ex.: custo total R$ 10 × fator 3 = R$ 30.</li></ul></div>`,
cor:`<div class="expl"><b>Para que serve esta aba</b><p>É a sua lista de <b>cores</b> e de <b>tamanhos/variações</b> (aro de anel, P M G, medidas…). O que você cria aqui aparece nos botões <b>＋ Cor da pedra</b> e <b>＋ Tamanho</b> na hora de lançar uma peça.</p><ul><li><b>Sigla:</b> letras curtas que entram no código da peça. Ex.: AN001A<b>17</b><b>AZ</b> = anel 001, banho A, tamanho 17, cor azul.</li><li><b>Palavra na descrição:</b> o que aparece no fim da descrição da peça. Ex.: a cor “Azul” pode escrever “azul turquesa”. Deixe vazio para usar o nome da cor; digite um traço (-) para não escrever nada.</li><li><b>Coluna do valor (nas variações):</b> a coluna da planilha que recebe o nome da opção. Cada opção marcada gera uma linha.</li><li><b>Pedra/detalhe:</b> marque nas cores que são cor de pedra. As cores de banho (Ouro, Prata…) ficam de fora porque o banho já tem sua própria escolha.</li></ul></div>`,
cat:`<div class="expl"><b>Para que serve esta aba</b><p>Aqui você organiza os <b>tipos de peça</b> (Brincos, Colares, Anéis…) e define como o <b>código</b> de cada peça é numerado.</p><ul><li><b>Categoria e subcategoria:</b> o tipo da peça. Ex.: categoria <i>Brincos</i>, subcategoria <i>Argola</i>. Vão para as colunas I e J.</li><li><b>Prefixo:</b> as letras do código. Ex.: BR para Brincos.</li><li><b>Última peça:</b> o último número que você já usou. O sistema continua dali: prefixo BR + última peça 1669 → a próxima peça é <b>BR1670</b>. Se duas categorias usam o mesmo prefixo, elas dividem a mesma contagem e os números nunca se repetem.</li><li><b>Texto da categoria na Descrição:</b> uma frase que o sistema escreve <b>sozinho no fim da descrição</b> de toda peça dessa categoria. Ex.: na categoria Prata 925, texto “Prata 925”: você digita “Argola lisa” e a planilha sai com “Argola lisa Prata 925”. Se a descrição já tiver esse texto, ele não repete. Vazio = não acrescenta nada.</li><li><b>NCM, CFOP e FCP:</b> códigos fiscais que o ERP pede (colunas Y, AA e AB). <b>Insumos:</b> custo do material extra, como embalagem (coluna Q). Se ficar vazio, vale o padrão da coluna.</li><li><b>Variação (tamanhos, letras…):</b> fica dentro da categoria. Ao escolher a categoria ao lançar, as opções aparecem sozinhas, só para ela.</li></ul></div>`,
forn:`<div class="expl"><b>Para que serve esta aba</b><p>Lista dos seus <b>fornecedores</b>. Ao escolher o fornecedor ao lançar uma peça, o sistema já preenche o resto.</p><ul><li><b>Nome</b> vai para a coluna H e o <b>código do fornecedor</b> para a G.</li><li><b>Desconto %:</b> abatimento que esse fornecedor dá. É aplicado ao custo de compra (coluna P). Ex.: custo R$ 100 com 10% = R$ 90.</li><li><b>Bruta ou pronta:</b> “bruta” é a peça que chega sem banho e vai para a galvânica (você escolhe os banhos). “Pronta” já chega banhada e não passa pela galvânica.</li><li><b>Aprendeu:</b> guarda os banhos e fatores que você usou da última vez com esse fornecedor, para reaproveitar.</li></ul></div>`,
col:`<div class="expl"><b>Para que serve esta aba</b><p>A planilha que você exporta tem várias colunas. Aqui você escolhe <b>como cada coluna se comporta enquanto você lança a peça</b>. Isto muda só o preenchimento, não a planilha final (isso é na aba Modelo da planilha).</p><ul><li><b>No lançamento:</b> mostra o campo no formulário. Desmarcado, o campo some do formulário.</li><li><b>Lembrar:</b> repete o valor digitado na próxima peça (útil para o que não muda, como o fornecedor).</li><li><b>Obrigatória:</b> o sistema não deixa lançar se estiver vazio.</li><li><b>Valor padrão:</b> entra sozinho quando você não preenche.</li><li><b>Opções:</b> lista de sugestões para escolher em vez de digitar.</li><li><b>Observações prontas:</b> frases que você usa sempre e aparecem para escolher na coluna M (Observação).</li></ul></div>`,
mod:`<div class="expl"><b>Para que serve esta aba</b><p>Define o <b>formato do arquivo</b> que vai para o sistema onde você vai importar as peças (Jueri, Bling…). Cada sistema pede os nomes e a ordem das colunas de um jeito.</p><ul><li><b>Cabeçalhos, ordem e colunas:</b> valem para o arquivo baixado (.xlsx ou .csv) e para o “Copiar para o Excel”.</li><li><b>Mapeamento:</b> liga cada coluna do sistema à coluna correspondente do ERP. Coluna desligada não sai no arquivo.</li><li><b>Trocar de modelo</b> em “Exportar para”, no topo, muda a saída sem mexer nas suas peças.</li></ul></div>`,
rom:`<div class="expl"><b>Para que serve esta aba</b><p>Ensina o sistema a <b>ler a lista de compra (romaneio) de cada fornecedor</b>. Cada fornecedor monta a lista de um jeito; aqui você diz onde cada informação está.</p><ul><li><b>Modelo de leitura:</b> diz onde estão código, descrição, quantidade e preço no texto ou PDF que você cola.</li><li><b>Palavras → categoria:</b> se a descrição tem a palavra “brinco”, a peça entra na categoria Brincos (e na subcategoria que você definir). Vão para as colunas I e J.</li><li>O que o modelo lê vira <b>cartões</b> no romaneio, e cada cartão vira uma ou mais linhas da planilha.</li></ul></div>`,
roml:`<div class="expl"><b>Para que serve esta aba</b><p>O <b>histórico</b> dos romaneios que você já importou.</p><ul><li><b>Observação (documento):</b> mostra o nome do arquivo importado.</li><li><b>Abrir:</b> reabre o romaneio para lançar o que faltou ou corrigir peças já lançadas. O código da peça fica o mesmo; só muda se você trocar a categoria.</li><li><b>Excluir:</b> apaga só o romaneio guardado. As peças que você já lançou na tabela continuam lá.</li></ul></div>`,
foto:`<div class="expl"><b>Para que serve esta aba</b><p>Envia as fotos das peças para um serviço de imagens na internet e guarda o <b>link</b>.</p><ul><li>O <b>link</b> vai para a coluna B (Foto) da planilha, porque os ERPs pedem o endereço da imagem, e não o arquivo.</li><li>A foto original do romaneio fica guardada à parte (coluna “Foto do romaneio”).</li><li>A <b>chave</b> do serviço fica só neste navegador e não entra no backup.</li></ul></div>`,
opc:`<div class="expl"><b>Para que serve esta aba</b><p>Traz <b>dados antigos</b> para o sistema e cuida da <b>segurança</b> do que você já fez.</p><ul><li><b>Importar planilha:</b> lê uma planilha que você já tinha, acerta a última peça de cada prefixo (a numeração continua dali) e traz fornecedores, categorias e cores.</li><li><b>Ordem das linhas:</b> define como a planilha é montada (A depois B, ou na ordem em que você lançou).</li><li><b>Backup e pontos de restauração:</b> guardam tudo (peças, cadastros, romaneios e fotos) para você voltar no tempo se algo der errado. Faça backup com frequência: os dados ficam só neste navegador.</li></ul></div>`};

function sec(id,titulo,resumo,corpo){SECS.push({id,titulo,resumo,corpo});return ""}
function abaCfg(){return SECS.some(s=>s.id===abertos.tab)?abertos.tab:SECS[0].id}
/* ===== Catálogo rápido: colar lista, modelos, duplicar seguro, renomear e ordenar ===== */
let renBusy=false,faixaBusy=false;
let catUI={colar:false,txt:"",dup:null,ren:null,corNova:null};
const partir=txt=>{const vistos=new Set(),r=[];String(txt==null?"":txt).split(/[;,\n\r]+/).forEach(x=>{x=x.replace(/\s+/g," ").trim().slice(0,60);const k=semAc(x);if(x&&!vistos.has(k)){vistos.add(k);r.push(x)}});return r};
const kSub=x=>semAc(x).replace(/(e?s)$/,"");
const addUnicos=(lista,itens)=>{let n=0;itens.forEach(x=>{if(!lista.some(y=>kSub(y)===kSub(x))){lista.push(x);n++}});return n};
function acharCat(C,nome){const k=semAc(nome);const c=C.categorias.find(x=>semAc(x.nome)===k);if(c)return c;const j=JUERI_CATS.find(x=>(x.alias||[]).some(a=>semAc(a)===k));return j?(C.categorias.find(x=>x.nome===j.nome)||null):null}
function prefixoNovo(C,nome){const L=semAc(nome).toUpperCase().replace(/[^A-Z]/g,"");if(L.length<2)return null;const cand=[L.slice(0,2),L.slice(0,3),L.slice(0,4)];for(let j=2;j<L.length;j++)cand.push(L[0]+L[j]);const livre=cand.find(c=>!prefixoEmUso(C,c,null));return livre?{p:livre,rep:false}:{p:L.slice(0,2),rep:true}}
function nomeCatErro(C,v,exceto){if(!v)return "Digite o nome da categoria.";if(v.length>40)return "O nome da categoria é longo demais (máximo 40 letras).";if(semAc(v).replace(/[^a-z]/g,"").length<2)return "O nome da categoria precisa ter pelo menos 2 letras (o prefixo da referência sai delas). Ex.: Anéis.";if(C.categorias.some(x=>x!==exceto&&semAc(x.nome)===semAc(v)))return `Já existe a categoria “${v}” (acento e maiúscula não diferenciam).`;return ""}
function nomeCatLivre(C,base){let n=base,k=2;while(C.categorias.some(x=>semAc(x.nome)===semAc(n)))n=base+" "+(k++);return n}
const MODELOS_CAT=[
 {id:"aneis",nome:"Anéis (com tamanhos)",linha:"Anéis",grade:true},
 {id:"colares",nome:"Colares",linha:"Colares: Corrente; Gargantilha; Choker; Longo; Pingente"},
 {id:"brincos",nome:"Brincos",linha:"Brincos: Argola; Ear cuff; Pequeno; Médio; Grande"},
 {id:"pulseiras",nome:"Pulseiras",linha:"Pulseiras: Bracelete; Corrente; Riviera; Elos"},
 {id:"conjuntos",nome:"Conjuntos",linha:"Conjuntos: Colar e brinco; Brinco e anel; Completo"}];
/* lê "Anéis: Solitário; Aparador" (uma categoria por linha) e diz o que seria criado, sem mexer em nada */
function planoLista(C,txt){const tmp={categorias:[...C.categorias]},novas=[],extra=[],erros=[];
  const todas=String(txt||"").split(/\r?\n/);if(todas.length>300)erros.push(`A lista tem ${todas.length} linhas: só as 300 primeiras serão lidas.`);
  todas.slice(0,300).forEach(ln=>{ln=ln.trim();if(!ln)return;const i=ln.indexOf(":"),nome=(i<0?ln:ln.slice(0,i)).replace(/\s+/g," ").trim(),subs=i<0?[]:partir(ln.slice(i+1));
    const nv=novas.find(n=>semAc(n.nome)===semAc(nome));if(nv){addUnicos(nv.subs,subs);return}
    const ex=acharCat(C,nome);
    if(ex){let e=extra.find(x=>x.c===ex);if(!e)extra.push(e={c:ex,add:[]});subs.forEach(sb=>{if(!ex.subs.some(y=>kSub(y)===kSub(sb))&&!e.add.some(y=>kSub(y)===kSub(sb)))e.add.push(sb)});return}
    const er=nomeCatErro(tmp,nome,null);if(er){erros.push(`“${nome.slice(0,40)}”: ${er}`);return}
    const pf=prefixoNovo(tmp,nome);novas.push({nome,prefixo:pf.p,rep:pf.rep,subs:subs.slice()});tmp.categorias.push({nome,prefixo:pf.p,subs:[]})});
  return{novas,extra:extra.filter(e=>e.add.length),erros}}
const contaPlano=pl=>[pl.novas.length,pl.novas.reduce((a,n)=>a+n.subs.length,0)+pl.extra.reduce((a,e)=>a+e.add.length,0)];
function aplicaPlano(C,pl){pl.novas.forEach(n=>{C.categorias.push({nome:n.nome,prefixo:n.prefixo,subs:n.subs.slice()});if(!(n.prefixo in C.seqs))C.seqs[n.prefixo]="0"});pl.extra.forEach(e=>addUnicos(e.c.subs,e.add))}
function previaInfo(C){const tx=String(catUI.txt||"");
  if(!tx.trim())return{html:`<span class="hint">Cole ou digite uma categoria por linha. As subcategorias vêm depois dos dois-pontos, separadas por ponto e vírgula.</span>`,ok:false};
  const pl=planoLista(C,tx),[nc,ns]=contaPlano(pl);let h="";
  h+=(nc||ns)?`<b>Vai ${nc?`criar ${nc} categoria${nc>1?"s":""}${ns?" e ":"."}`:"acrescentar "}${ns?`${ns} subcategoria${ns>1?"s":""}.`:""}</b>`:`<b>Nada novo para criar</b> — tudo isso já está cadastrado.`;
  const li=[];pl.novas.forEach(n=>li.push(`<li><b>${esc(n.nome)}</b> <span class="mono">${esc(n.prefixo)}</span>${n.rep?` <span class="warn">prefixo repetido: divide a numeração com outra categoria</span>`:""}${n.subs.length?" — "+esc(n.subs.join(", ")):""}</li>`));
  pl.extra.forEach(e=>li.push(`<li><b>${esc(e.c.nome)}</b> já existe: entram só ${esc(e.add.join(", "))}</li>`));
  pl.erros.forEach(m=>li.push(`<li class="bad">${esc(m)}</li>`));
  if(li.length)h+=`<ul>${li.slice(0,15).join("")}${li.length>15?`<li>…e mais ${li.length-15}</li>`:""}</ul>`;
  return{html:h,ok:!!(nc||ns)}}
function atualizaPrevia(){const p=document.getElementById("colarPrev"),b=document.getElementById("colarOk");if(!p)return;const r=previaInfo(cfg());p.innerHTML=r.html;if(b)b.disabled=!r.ok}
function catTopo(C){
  const banner=(!abertos.catBanner&&!C.categorias.some(c=>!JUERI_CATS.some(j=>j.nome===c.nome)))?`<div class="banner" role="note"><b>Primeira vez aqui?</b><span>Monte o seu catálogo de uma vez: cole a lista de categorias e subcategorias ou comece por um modelo pronto.</span><button type="button" class="btn pri sm" data-act="colar-abrir">Montar meu catálogo</button><button type="button" class="x" data-act="banner-fechar" aria-label="Fechar esta faixa" title="Fechar">×</button></div>`:"";
  const mod=`<details class="mdl"><summary class="btn sm" title="Cria categorias e subcategorias comuns de joalheria; só entra o que ainda não existe">Começar com um modelo</summary><div class="row">${MODELOS_CAT.map(m=>`<button type="button" class="btn sm" data-act="modelo-add" data-m="${m.id}">${esc(m.nome)}</button>`).join("")}<button type="button" class="btn sm pri" data-act="modelo-add" data-m="todos">Todos</button></div><div class="hint">Só entra o que ainda não existe — nada do que você já cadastrou muda.</div></details>`;
  let painel="";
  if(catUI.colar){const r=previaInfo(C);
    painel=`<div class="cpanel" id="colarPanel"><b>Colar lista de categorias</b><span class="hint">Uma categoria por linha, assim: <span class="mono">Anéis: Solitário; Aparador; Meia aliança</span>. Se a categoria já existe, só entram as subcategorias que faltam.</span><textarea id="colarTx" data-colar aria-label="Lista de categorias e subcategorias" placeholder="Anéis: Solitário; Aparador; Meia aliança&#10;Colares: Corrente; Choker">${esc(catUI.txt)}</textarea><div id="colarPrev" class="prev" aria-live="polite">${r.html}</div><div class="row"><button type="button" class="btn pri sm" id="colarOk" data-act="colar-ok" ${r.ok?"":"disabled"}>Criar</button><button type="button" class="btn ghost sm" data-act="colar-fechar">Cancelar</button></div></div>`}
  return banner+`<div class="row"><button type="button" class="btn sm${catUI.colar?" pri":""}" data-act="${catUI.colar?"colar-fechar":"colar-abrir"}" aria-expanded="${catUI.colar?"true":"false"}" title="Cria várias categorias e subcategorias de uma vez a partir de uma lista">Colar lista</button>${mod}</div>`+painel}
/* duplicar categoria com cuidado: nome, prefixo livre e o que copiar */
function dupAviso(C,d){const p=String(d.pre||"").toUpperCase();if(!p)return "Escolha um prefixo de 1 a 4 letras.";
  const com=C.categorias.filter(x=>String(x.prefixo||"").toUpperCase()===p||Object.values(x.subPref||{}).some(v=>String(v).toUpperCase()===p)).map(x=>x.nome);
  return com.length?`O prefixo ${p} já é de ${com.join(", ")}: a cópia vai dividir a mesma numeração (continua de ${p}${ultimo(p)}). Troque o prefixo se não quiser.`:""}
function dupPainel(C,c){const d=catUI.dup,av=dupAviso(C,d);
  return `<div class="cpanel" data-dup><b>Duplicar “${esc(c.nome)}”</b><div class="row"><label class="fl" style="flex:1 1 160px"><span>Nome da nova categoria</span><input data-dup="nome" value="${esc(d.nome)}" maxlength="40"></label><label class="fl" style="width:84px"><span>Prefixo</span><input data-dup="pre" value="${esc(d.pre)}" maxlength="4" style="text-transform:uppercase" title="1 a 4 letras. Sugerido: um prefixo que ninguém usa ainda"></label></div>
  <label class="vchk"><input type="checkbox" data-dup="subs" ${d.subs?"checked":""}> Copiar as subcategorias</label><label class="vchk"><input type="checkbox" data-dup="grade" ${d.grade?"checked":""}> Copiar a variação (tamanhos, letras…)</label>
  <div class="hint">Os prefixos próprios das subcategorias não são copiados.</div><div class="soft" id="dupAviso" role="status" ${av?"":"hidden"}>${esc(av)}</div>
  <div class="row"><button type="button" class="btn pri sm" data-act="cat-dup-ok">Criar cópia</button><button type="button" class="btn ghost sm" data-act="cat-dup-no">Cancelar</button></div></div>`}
function dupAbrir(ci){const C=cfg(),c=C.categorias[ci];if(!c)return;const nome=nomeCatLivre(C,c.nome.slice(0,30)+" (cópia)"),pf=prefixoNovo(C,nome);
  catUI.dup={i:ci,nome,pre:pf?pf.p:"",preManual:false,subs:true,grade:true};renderCfg();const el=document.querySelector(`[data-cat="${ci}"] [data-dup="nome"]`);if(el){el.focus();el.select()}}
function dupCampo(t){const d=catUI.dup;if(!d)return;const k=t.dataset.dup,C=cfg();
  if(k==="nome"){d.nome=t.value;if(!d.preManual){const pf=prefixoNovo(C,d.nome);d.pre=pf?pf.p:"";const pi=document.querySelector('[data-dup="pre"]');if(pi)pi.value=d.pre}}
  else if(k==="pre"){d.pre=t.value.toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);t.value=d.pre;d.preManual=true}
  else d[k]=t.checked;
  const a=document.getElementById("dupAviso");if(a){const m=dupAviso(C,d);a.textContent=m;a.hidden=!m}}
function dupOk(){const C=cfg(),d=catUI.dup;if(!d)return;const c=C.categorias[d.i];if(!c){catUI.dup=null;renderCfg();return}
  const nome=String(d.nome||"").replace(/\s+/g," ").trim(),er=nomeCatErro(C,nome,null);if(er){toast(er);const el=document.querySelector('[data-dup="nome"]');if(el)el.focus();return}
  const pre=String(d.pre||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);if(!pre){toast("O prefixo precisa ter de 1 a 4 letras.");const el=document.querySelector('[data-dup="pre"]');if(el)el.focus();return}
  const av=dupAviso(C,{pre}),n=clone(c);n.nome=nome;n.prefixo=pre;delete n.subPref;
  if(!d.subs){n.subs=[];delete n.subSoRef}
  if(!d.grade)delete n.grade;else if(n.grade){n.grade.id=uid();if(Array.isArray(n.grade.itens))n.grade.itens.forEach(x=>{x.id=uid()});if(n.grade.subs&&!d.subs)n.grade.subs=[]}
  C.categorias.splice(d.i+1,0,n);if(!(pre in C.seqs))C.seqs[pre]="0";catUI.dup=null;salvar(true,false);render();
  toast(`Categoria “${nome}” criada com o prefixo ${pre}.${av?" "+av:""}`,{t:"Desfazer",fn:desfazer});refocar(`[data-cat="${d.i+1}"] [data-enter="sub"]`)}
function focoChip(ci,j){const el=document.querySelectorAll(`[data-cat="${ci}"] .chip .cn`)[j];if(el)el.focus()}
function subRenomear(ci,j,novo){if(renBusy)return;renBusy=true;try{subRenomear0(ci,j,novo)}finally{renBusy=false}}
function subRenomear0(ci,j,novo){const C=cfg(),c=C.categorias[ci];catUI.ren=null;if(!c||j>=c.subs.length){renderCfg();return}
  const old=c.subs[j];novo=String(novo||"").replace(/\s+/g," ").trim();
  if(!novo||novo===old){renderCfg();return}
  if(novo.length>60){toast("O nome da subcategoria é longo demais (máximo 60 letras).");renderCfg();return}
  if(c.subs.some((x,k)=>k!==j&&semAc(x)===semAc(novo))){toast(`Já existe a subcategoria “${novo}” em ${c.nome}.`);renderCfg();return}
  c.subs[j]=novo;
  const mv=o=>{if(o&&Object.prototype.hasOwnProperty.call(o,old)){o[novo]=o[old];delete o[old]}};mv(c.subPref);mv(c.subSoRef);
  if(c.grade&&Array.isArray(c.grade.subs))c.grade.subs=c.grade.subs.map(x=>x===old?novo:x);
  if(c.coresCfg&&Array.isArray(c.coresCfg.subs))c.coresCfg.subs=c.coresCfg.subs.map(x=>x===old?novo:x);

/* restaurar backup completo: valida TUDO e monta objetos novos antes de mexer em qualquer coisa. Semântica: SUBSTITUI peças,

const ehObj=x=>x!==null&&typeof x==="object"&&!Array.isArray(x);

const PREFIXO_RUIM=/[<>"'&`\\]/;
function checarConfig(c){
  const erro=m=>{throw new Error(m)};
  if(!ehObj(c))erro("os cadastros estão em formato errado");
  if(c.cores!=null&&!ehLista(c.cores,ehTxt))erro("a lista de cores está errada");
  if(c.observacoes!=null&&!ehLista(c.observacoes,ehTxt))erro("a lista de observações está errada");
  if(c.ordem!=null&&!ehTxt(c.ordem))erro("a ordem da tabela, nos cadastros, está errada");
  if(c.modelo!=null&&!ehTxt(c.modelo))erro("o modelo de planilha escolhido está errado");
  if(c.seqs!=null&&!(ehObj(c.seqs)&&Object.values(c.seqs).every(campoOk)))erro("a numeração (última peça de cada tipo) está errada");
  if(c.categorias!=null){if(!Array.isArray(c.categorias))erro("a lista de categorias está errada");
    c.categorias.forEach((x,i)=>{if(!ehObj(x)||!ehTxt(x.nome)||!x.nome.trim())erro("a categoria "+(i+1)+" está sem nome ou em formato errado");
      const nm="“"+x.nome.slice(0,30)+"”";
      if(x.prefixo!=null&&(!ehTxt(x.prefixo)||PREFIXO_RUIM.test(x.prefixo)))erro("a categoria "+nm+" tem um prefixo inválido");
      if(x.sufixo!=null&&!ehTxt(x.sufixo))erro("a categoria "+nm+" tem um sufixo inválido");
      if(x.subs!=null&&!ehLista(x.subs,ehTxt))erro("as subcategorias de "+nm+" estão erradas");
      if(x.subPref!=null&&!(ehObj(x.subPref)&&Object.values(x.subPref).every(v=>ehTxt(v)&&!PREFIXO_RUIM.test(v))))erro("os prefixos das subcategorias de "+nm+" estão errados");
      if(x.subSoRef!=null&&!ehObj(x.subSoRef))erro("as subcategorias de "+nm+" estão erradas");
      if(x.grade!=null&&!(ehObj(x.grade)&&Array.isArray(x.grade.itens)&&x.grade.itens.every(ehObj)))erro("a variação (tamanhos) de "+nm+" está errada")})}
  if(c.fornecedores!=null&&!ehLista(c.fornecedores,f=>ehObj(f)&&ehTxt(f.nome)))erro("a lista de fornecedores está errada");
  if(c.banhistas!=null&&!ehLista(c.banhistas,b=>ehObj(b)&&Array.isArray(b.banhos)&&b.banhos.every(ehObj)))erro("a lista de galvânicas está errada");
  if(c.grades!=null&&!ehLista(c.grades,g=>ehObj(g)&&Array.isArray(g.itens)&&g.itens.every(ehObj)))erro("a lista de variações está errada");
  if(c.modelos!=null&&!ehLista(c.modelos,m=>ehObj(m)&&Array.isArray(m.cols)&&m.cols.every(ehObj)))erro("a lista de modelos de planilha está errada");

  if(c.colcfg!=null&&!(ehObj(c.colcfg)&&Object.values(c.colcfg).every(ehObj)))erro("a configuração das colunas está errada")}
function checarLanc(l,i,quem){const n=(quem||"peça")+" "+(i+1),erro=m=>{throw new Error(n+": "+m)};
  if(!ehObj(l))erro("está em formato errado");

  if(!(Number.isInteger(o.v)&&o.v>=1&&o.v<=1))erro("este backup é de uma versão que este programa não conhece ("+String(o.v).slice(0,10)+")");

    `${R.itens.length} peças · ${tot.l} linhas · ${tot.un} unidades (lista: ${m.naLista}) · Custo ${fm(tot.cu)} · Varejo ${fm(tot.vr)}`,`Referências criadas: ${relFaixas(R).join(" · ")||"—"}`,m.conf?`Conferência da lista: ${m.conf}`:"",""];

function relNormalizar(R){

  const m=R.meta;
  return {...R,em:N(R.em,Date.now()),meta:{...m,forn:T(m.forn),banhista:T(m.banhista),obs:T(m.obs),conf:T(m.conf),tipo:T(m.tipo),modelo:T(m.modelo),naLista:N(m.naLista,0),un:N(m.un,0)},
    itens:R.itens.map((i,n)=>{if(!ehObj(i)||!Array.isArray(i.linhas))throw new Error("o item "+(n+1)+" do relatório está em formato errado");
      return {...i,desc:T(i.desc),cod:T(i.cod),cat:T(i.cat),sub:T(i.sub),peso:T(i.peso),compra:T(i.compra),foto:ftOk(i.foto)?i.foto:null,un:N(i.un,0),custo:N(i.custo,0),vr:N(i.vr,0),
        linhas:i.linhas.map(l=>{if(!ehObj(l))throw new Error("uma linha do relatório está em formato errado");return {...l,ref:T(l.ref),cor:T(l.cor),q:N(l.q,0),cu:N(l.cu,0),v:l.v==null?null:N(l.v,null)}})}}),
    ign:(R.ign||[]).map(g=>ehObj(g)?{...g,desc:T(g.desc),cod:T(g.cod),motivo:T(g.motivo)}:{desc:"",cod:"",motivo:""})}}

  if(ign.length)toast("Formato não aceito: "+ign.join(", ")+" (use PDF, XML, xlsx, xls, csv ou txt).");
  else if(ok.length&&IMPQ.some(q=>q.dup))toast("Atenção: há arquivo(s) já importado(s) na fila (marcados).");
  renderImp()}
function renderImp(){const el=document.getElementById("impBar");if(!el)return;
  el.innerHTML=`<div class="imp-r"><button type="button" class="btn pri" data-act="rom-abrir" title="Colar o texto da lista do fornecedor ou continuar o romaneio em andamento">Romaneio</button><button type="button" class="btn" data-act="imp-pick" title="Escolher um ou vários arquivos">Importar arquivos…</button><span class="hint">PDF, XML da nota, planilha (xlsx, xls, csv) ou txt · escolha ou arraste vários arquivos para cá e ajuste a ordem</span></div>${IMPQ.length?`<ol class="imp-q">${IMPQ.map((q,i)=>`<li class="${q.dup||q.rep?"dup":""}"><span class="n">${i+1}</span><b title="${esc(q.name)}">${esc(q.name)}</b><small>${q.dup?"já importado em "+esc(impData(q.dup))+(q.dup.forn?" · "+esc(q.dup.forn):""):q.rep?"repetido nesta fila":"aguardando"}</small><span class="acts"><button type="button" class="x" data-act="imp-up" data-i="${i}" ${i?"":"disabled"} aria-label="Subir na fila">↑</button><button type="button" class="x" data-act="imp-down" data-i="${i}" ${i<IMPQ.length-1?"":"disabled"} aria-label="Descer na fila">↓</button><button type="button" class="btn sm" data-act="imp-abrir" data-i="${i}">Abrir</button><button type="button" class="x" data-act="imp-del" data-i="${i}" aria-label="Tirar da fila">×</button></span></li>`).join("")}</ol><div class="imp-r"><button type="button" class="btn sm pri" data-act="imp-abrir" data-i="0">Abrir o primeiro</button><button type="button" class="btn sm ghost" data-act="imp-limpar">Limpar fila</button><span class="hint">O romaneio aberto é guardado antes de abrir o próximo.</span></div>`:""}`}
{const el=document.getElementById("impBar");if(el){
  el.addEventListener("dragover",e=>{if(e.dataTransfer&&[...(e.dataTransfer.types||[])].includes("Files")){e.preventDefault();e.stopPropagation();el.classList.add("over")}});
  el.addEventListener("dragleave",()=>el.classList.remove("over"));
  el.addEventListener("drop",e=>{e.preventDefault();e.stopPropagation();el.classList.remove("over");const fl=[...((e.dataTransfer&&e.dataTransfer.files)||[])];if(fl.length)impAdd(fl)});
  renderImp()}}
/* ===== v20: cartões de categoria recolhíveis ===== */
const CARDX=new Set();
function cardsModoCompacto(){return abertos.catc==null?celular():!!abertos.catc}
function cardsDecorar(){
  const cs=document.querySelector("#cfg .cards");if(!cs||!cs.querySelector(".card[data-cat]"))return;
  const cmp=cardsModoCompacto();cs.classList.toggle("cmp",cmp);
  cs.querySelectorAll(".card[data-cat]").forEach(c=>{
    c.classList.toggle("exp",CARDX.has(c.dataset.cat));
    const r=c.firstElementChild;if(!r||r.querySelector(".cx"))return;
    const b=document.createElement("button");b.type="button";b.className="cx";b.title="Expandir ou recolher os detalhes desta categoria";b.setAttribute("aria-label","Expandir ou recolher a categoria");b.textContent="▾ Expandir";r.appendChild(b)});
  cs.querySelectorAll(".cx").forEach(b=>{const t=b.closest(".card").classList.contains("exp")||!cmp?"▴ Recolher":"▾ Expandir";if(b.textContent!==t)b.textContent=t});
  if(!document.getElementById("cardsBar")){const bar=document.createElement("div");bar.id="cardsBar";bar.className="cardsbar";
    bar.innerHTML='<button type="button" class="btn sm" id="cardsTog"></button><span class="hint">Cada categoria tem prefixo, impostos, subcategorias e tamanhos — abra só a que for editar.</span>';cs.before(bar)}
  const t=document.getElementById("cardsTog"),tx=cmp?"▾ Expandir todas":"▴ Recolher todas";if(t&&t.textContent!==tx)t.textContent=tx}
{const cf=document.getElementById("cfg");if(cf)new MutationObserver(()=>{try{cardsDecorar()}catch(e){}}).observe(cf,{childList:true,subtree:true});try{cardsDecorar()}catch(e){}}
document.getElementById("cfg").addEventListener("click",e=>{
  const x=e.target.closest(".card .cx");
  if(x){const c=x.closest(".card"),k=c.dataset.cat;
    if(cardsModoCompacto()){if(CARDX.has(k))CARDX.delete(k);else CARDX.add(k)}
    else{/* tudo aberto: o botão recolhe só esta — as demais continuam abertas */abertos.catc=true;guardarAbertos();CARDX.clear();document.querySelectorAll("#cfg .card[data-cat]").forEach(cc=>{if(cc!==c)CARDX.add(cc.dataset.cat)})}
    cardsDecorar();return}
  if(e.target.closest("#cardsTog")){const cmp=cardsModoCompacto();abertos.catc=!cmp;guardarAbertos();CARDX.clear();cardsDecorar();return}
  const pd=e.target.closest(".tabp .sb>p.d");if(pd&&celular())pd.classList.toggle("mais")});

/* ===== v20: rótulos nas células das tabelas de cadastro (para virarem cartões no celular) ===== */
function tabelasRotular(){document.querySelectorAll("#cfg table.cfg:not(.bnt)").forEach(t=>{const hs=[...t.querySelectorAll("thead th")].map(h=>h.textContent.trim());
  if(!hs.length)return;t.querySelectorAll("tbody tr").forEach(tr=>{[...tr.children].forEach((td,i)=>{if(td.tagName==="TD"&&td.dataset.l===undefined)td.dataset.l=hs[i]||""})})})}
{const cf=document.getElementById("cfg");if(cf){new MutationObserver(()=>{try{tabelasRotular()}catch(e){}}).observe(cf,{childList:true,subtree:true});try{tabelasRotular()}catch(e){}}}

/* ===== v19: visões (Dividida · Planilha · Lançar · Cadastros) ===== */
function visAtual(){const v=document.body.dataset.vis||"tudo";return v}
function visPara(v,soSeEscondido){
  if(celular()&&v==="tudo")v="planilha";
  if(!celular()&&v==="lancar")v="tudo"; /* o lançamento nunca é uma tela própria: fica sempre embaixo da tabela */
  const a=visAtual();
  if(soSeEscondido){const escondido=v==="cad"?(a==="planilha"||a==="lancar"):(a==="planilha"||a==="cad");if(!escondido)return}
  document.body.dataset.vis=v;abertos.vis=v;guardarAbertos();
  document.querySelectorAll("#vis [data-vis]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.vis===v)));
  if(celular())formAbrir(v==="lancar");
  const pb=document.getElementById("paneBot");if(pb&&v!=="planilha")pb.scrollTo({top:0});
  if(typeof sideMarcar==="function")sideMarcar();
  pilulaAtualiza();if(celular()&&v!=="lancar")window.scrollTo({top:0});
}
document.getElementById("vis").addEventListener("click",e=>{if(e.target.closest("#vpal")){palAbrir();return}const b=e.target.closest("button[data-vis]");if(!b)return;visPara(b.dataset.vis);if(b.dataset.vis==="lancar"&&!celular())refocar("#f-F")});
document.addEventListener("keydown",e=>{
  const t=e.target,campo=/INPUT|TEXTAREA|SELECT/.test(t.tagName)||t.isContentEditable;
  if(e.altKey&&!e.ctrlKey&&!e.metaKey&&/^[1-3]$/.test(e.key)){e.preventDefault();visPara(["tudo","planilha","cad"][+e.key-1]);return}
  if(e.key==="/"&&!campo&&!e.ctrlKey&&!e.metaKey&&!e.altKey){const fb=document.getElementById("fBusca");if(fb&&!fb.closest("[hidden]")){e.preventDefault();if(visAtual()==="lancar"||visAtual()==="cad")visPara(celular()?"planilha":"tudo");fb.focus();fb.select()}}
});
visPara(abertos.vis&&["tudo","planilha","lancar","cad"].includes(abertos.vis)?(abertos.vis==="lancar"&&celular()?"planilha":abertos.vis):(celular()?"planilha":"tudo"));
/* ===== v19: menu lateral ===== */
function sideMarcar(){const sd=document.getElementById("side");if(!sd||sd.hidden)return;const v=document.body.dataset.vis||"tudo";
  const marca=(b,on)=>{if(on)b.setAttribute("aria-current","true");else b.removeAttribute("aria-current")};
  sd.querySelectorAll("[data-vis]").forEach(b=>marca(b,b.dataset.vis===v));
  sd.querySelectorAll("[data-go^=\"sec:\"]").forEach(b=>marca(b,(v==="cad"||v==="tudo")&&b.dataset.go==="sec:"+abertos.tab))}
function sideAplicar(modo){/* "open" = expandido · "mini" = faixa estreita só com ícones */
  if(modo!=="mini")modo="open";
  const sd=document.getElementById("side");if(celular()){sd.hidden=true;document.body.classList.remove("side-on","side-mini");return}
  sd.hidden=false;document.body.classList.add("side-on");document.body.classList.toggle("side-mini",modo==="mini");
  abertos.side=modo;guardarAbertos();sideMarcar()}
function hdrLayout(){const hin=document.querySelector("header .hin");if(!hin)return;
  const st=document.getElementById("saveStatus"),ud=hin.querySelector(".udo"),sp=hin.querySelector(".sp"),top=document.getElementById("sideTop"),ex=document.getElementById("sideExp");if(!st||!ud||!sp||!top||!ex)return;
  if(!celular()){if(st.parentNode!==top)top.append(st,ud);if(sp.parentNode!==ex)ex.append(sp)}
  else{const ref=hin.querySelector("nav.ir");if(st.parentNode!==hin){hin.insertBefore(st,ref);hin.insertBefore(ud,ref)}if(sp.parentNode!==hin)hin.append(sp)}}
window.addEventListener("resize",()=>{hdrLayout();if(!celular())sideAplicar(abertos.side)});
hdrLayout()

document.getElementById("sideT").addEventListener("click",()=>sideAplicar(abertos.side==="mini"?"open":"mini"));
document.getElementById("side").addEventListener("click",e=>{
  const v=e.target.closest("button[data-vis]");if(v){visPara(v.dataset.vis);if(v.dataset.vis==="lancar")refocar("#f-F");return}
  const g=e.target.closest("[data-go]");if(!g)return;const [k,id]=g.dataset.go.split(":");
  if(k==="sec"){if(celular())formAbrir(false);irPara(id);return}
  /* ações: aciona o botão que já existe no app (o menu não tem cópia deles) */
  const alvo=document.querySelector('[data-act="'+id+'"]');if(alvo)alvo.click()});
document.addEventListener("click",()=>setTimeout(sideMarcar,0));
document.addEventListener("keydown",e=>{if(e.altKey&&!e.ctrlKey&&!e.metaKey&&e.key.toLowerCase()==="b"){e.preventDefault();document.getElementById("vside").click()}});
if(!celular())sideAplicar(abertos.side);
/* celular: a barra de baixo some o "Lançar peça" quando o formulário já está na tela */
try{const io=new IntersectionObserver(es=>{document.body.classList.toggle("formvis",!celular()&&es.some(x=>x.isIntersecting))},{threshold:0.1});io.observe(document.getElementById("formWrap"))}catch(e){}
/* ===== Cadastros: alterações só valem depois de SALVAR; romaneio aberto acompanha o cadastro =====
   Enquanto há alterações pendentes nos Cadastros: nada é gravado (nem no navegador nem na conta), as ações da tabela, do formulário e do
   romaneio ficam travadas, e a barra "Salvar / Descartar" fica na tela. Descartar devolve cadastros, peças e romaneio ao que eram.
   Em teste automatizado (navigator.webdriver) o modo é o antigo (grava na hora), a não ser que localStorage "cadpecas-cad-estrito"="1". */
const CAD={snap:null,pend:false,hL:0,hR:null,sig:null,rt:null};
const CADAUTO=(()=>{try{return !!navigator.webdriver&&localStorage.getItem("cadpecas-cad-estrito")!=="1"}catch(e){return false}})();
const cadLancSig=()=>JSON.stringify(S.lanc,(k,v)=>(k==="ft"||k==="ftR"||k==="foto")?undefined:v);
const cadRomSig=()=>ROM&&ROM.rows?JSON.stringify(ROM.rows,(k,v)=>k==="foto"?undefined:v):null;
function cadTirarFoto(){try{flushJa()}catch(e){}
  CAD.snap={c:JSON.stringify(S.config),l:cadLancSig(),f:JSON.stringify(S.form),r:cadRomSig(),rasc:rascunho?JSON.stringify(rascunho,(k,v)=>k==="ft"?undefined:v):null};
  CAD.hL=HIST.length;CAD.hR=REDO.slice()}
function cadBarra(){let b=document.getElementById("cadBar");
  if(!CAD.pend){if(b)b.remove();return}
  if(!b){b=document.createElement("div");b.id="cadBar";b.setAttribute("role","alert");
    b.innerHTML=`<span><b>Alterações nos Cadastros ainda não salvas.</b> Só valem depois de salvar; até lá o resto do app fica travado.</span><button type="button" class="btn pri sm" data-cad="salvar">Salvar alterações</button><button type="button" class="btn sm" data-cad="descartar">Descartar</button>`;document.body.appendChild(b)}}
function cadConferir(){
  if(CADAUTO)return;
  if(CAD.snap){const mudou=JSON.stringify(S.config)!==CAD.snap.c||cadLancSig()!==CAD.snap.l;
    if(mudou&&!CAD.pend){CAD.pend=true;setStatus("Cadastros: alterações NÃO salvas",true)}
    if(!mudou&&CAD.pend){CAD.pend=false;setStatus("Salvo neste navegador")}
    if(!mudou)CAD.snap=null}
  cadBarra()}
function cadRomAtualizar(){   /* romaneio aberto acompanha o cadastro (valores da galvânica, banhos, fornecedores…) */
  if(!ROM||!ROM.rows||!ROM.rows.length)return;
  const s=JSON.stringify(S.config);if(s===CAD.sig)return;CAD.sig=s;
  clearTimeout(CAD.rt);CAD.rt=setTimeout(()=>{CAD.rt=null;if(!ROM||!ROM.rows||!ROM.rows.length)return;const w=document.getElementById("romWrap"),pos=[];for(let e=w;e;e=e.parentElement)if(e.scrollHeight>e.clientHeight)pos.push([e,e.scrollTop]);
    try{renderRom()}finally{pos.forEach(([e,t])=>{e.scrollTop=t})}},350)}
function cadSalvar(){if(!CAD.pend)return;CAD.pend=false;CAD.snap=null;cadBarra();
  dirty.c=true;dirty.l=true;try{histNota()}catch(e){}clearTimeout(sT);sT=null;setStatus("Salvando…");chain=chain.then(flush);
  render();if(ROM&&ROM.rows&&ROM.rows.length)renderRom();toast("Cadastros salvos.")}
function cadDescartar(){const s=CAD.snap;if(!CAD.pend||!s)return;
  const lancAtual=new Map(S.lanc.map(l=>[l.id,l]));
  S.config=JSON.parse(s.c);S.form=JSON.parse(s.f);
  S.lanc=JSON.parse(s.l).map(l=>{const a=lancAtual.get(l.id);if(a){if(a.ft!==undefined)l.ft=a.ft;if(a.ftR!==undefined)l.ftR=a.ftR}return l});
  if(s.r&&ROM&&ROM.rows){const rs=JSON.parse(s.r);rs.forEach((o,i)=>{const r=ROM.rows[i];if(!r)return;Object.keys(r).forEach(k=>{if(k!=="foto"&&!(k in o))delete r[k]});Object.assign(r,o)})}
  if(s.rasc&&rascunho){const o=JSON.parse(s.rasc);Object.keys(rascunho).forEach(k=>{if(k!=="ft"&&!(k in o))delete rascunho[k]});Object.assign(rascunho,o)}
  HIST.length=Math.min(HIST.length,CAD.hL);REDO.length=0;CAD.hR.forEach(x=>REDO.push(x));
  CAD.pend=false;CAD.snap=null;CAD.sig=JSON.stringify(S.config);cadBarra();
  try{sincGrade(S.form)}catch(e){}
  try{histIni()}catch(e){}
  render();if(ROM&&ROM.rows&&ROM.rows.length){renderRom();romSalvarSoon()}setStatus(db?"Salvo na sua conta":"Salvo neste navegador");toast("Alterações dos Cadastros descartadas.")}
/* enquanto há alterações pendentes: grava nada */
{const flush0=flush;flush=async function(){if(CAD.pend)return true;return flush0()}}
/* travas */
const CAD_TRAVA="#form,#sheet,#romWrap,#tools,#banner,#impBar,#fil,#btnUndo,#btnRedo,#side [data-act]";
function cadAviso(){const b=document.getElementById("cadBar");if(b){b.classList.remove("pisca");void b.offsetWidth;b.classList.add("pisca")}toast("Salve ou descarte as alterações dos Cadastros antes de continuar.")}
const CAD_TIPOS=["click","dblclick","mousedown","input","change","keydown","paste","drop","cut"];
CAD_TIPOS.forEach(tp=>window.addEventListener(tp,e=>{
  const t=e.target;if(!t||!t.closest)return;
  if(!CAD.rt&&t.closest("#cfg"))CAD.sig=JSON.stringify(S.config);   /* referência para saber se o cadastro mudou neste evento */
  if(CADAUTO)return;
  const bar=t.closest("#cadBar");
  if(bar){if(tp==="click"){const b=t.closest("[data-cad]");if(b){e.preventDefault();e.stopPropagation();b.dataset.cad==="salvar"?cadSalvar():cadDescartar()}}return}
  if(CAD.pend){
    const ctl="select,input[type=checkbox],input[type=radio],input[type=file]";
    const nav=tp==="keydown"&&(["Tab","Escape","Shift","Control","Alt","Meta","Home","End","PageUp","PageDown"].includes(e.key)||e.key.startsWith("Arrow")||((e.ctrlKey||e.metaKey)&&/^[ac]$/i.test(e.key)));
    const undo=tp==="keydown"&&(e.ctrlKey||e.metaKey)&&/^[zy]$/i.test(e.key)&&!t.closest("#cfg");
    const fora=!!t.closest(CAD_TRAVA)&&!t.closest("#cfg");
    let bloq=undo;
    if(!bloq&&fora)bloq=tp==="mousedown"?!!t.closest(ctl):tp==="keydown"?!nav:true;
    if(bloq){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();if(tp!=="mousedown"&&tp!=="input")cadAviso();return}}
  else if(!CAD.snap&&t.closest("#cfg")&&tp!=="mousedown"&&!(tp==="keydown"&&(e.key==="Tab"||e.key.startsWith("Arrow")||e.key==="Shift"||e.key==="Control"||e.key==="Alt"||e.key==="Meta"))){cadTirarFoto()}
},true));
/* depois de cada evento (e depois que os temporizadores dos cadastros rodaram) confere o que mudou */
CAD_TIPOS.forEach(tp=>window.addEventListener(tp,e=>{const t=e.target;if(!t||!t.closest||!t.closest("#cfg"))return;
  setTimeout(()=>{cadConferir();cadRomAtualizar()},0);setTimeout(()=>{cadConferir();cadRomAtualizar()},700)}));
window.addEventListener("beforeunload",e=>{if(CAD.pend){e.preventDefault();e.returnValue="";return ""}});
})();
